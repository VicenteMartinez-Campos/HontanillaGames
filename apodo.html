<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Apodo - Hontanilla Games</title>
        <link rel="stylesheet" href="css/estilos.css">
    </head>
    <body class="pantalla-centrada">
        <main class="tarjeta">
            <header>
                <img class="logo" src="img/Logo.png">
                <h1>¡Casi terminamos!</h1>
                <p>Introduce tu apodo antes de entrar.</p>
            </header>

            <form action="lobby.html" method="get">
                <label>
                    Tu apodo:
                    <input type="text" name="apodo" placeholder="Ej. AuraFarmer777" required autocomplete="off">
                </label>

                <div>
                    <p>🎁 Por registrarte, recibes <strong data-dato="aura">+1.000</strong>✨ de aura de regalo.</p>
                </div>

                <button type="submit" class="boton">Empezar</button>
            </form>
        </main>
    </body>
</html>
