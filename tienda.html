<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Tienda - Hontanilla Games</title>
        <link rel="stylesheet" href="css/estilos.css">
    </head>
    <body>
        <header class="barra">
            <div class="barra_derecha">
                <img class="logo_barra" src="img/Logo.png">
                Hontanilla Games
            </div>
            <div>
                <p><span>1.000✨</span></p>
                <div>Apodo Jugador</div>
            </div>
        </header>

        <main class="principal">
            <h2>Tienda</h2>
            
            <div class="rejilla-tienda-completa">
                <div class="rejilla-tienda">
                
                    <article class="tarjeta">
                        <span>👑</span>
                        <div>
                            <h3>Casco</h3>
                            <p>Nivel 1 - <strong>250✨</strong></p>
                        </div>
                        <button class="boton">Comprar</button>
                    </article>

                    <article class="tarjeta">
                        <span>🧥</span>
                        <div>
                            <h3>Armadura</h3>
                            <p>Nivel 2 - <strong>500✨</strong></p>
                        </div>
                        <button class="boton">Comprar</button>
                    </article>

                </div>

                <div class="rejilla-tienda">
                    <article class="tarjeta">
                        <span>🥾</span>
                        <div>
                            <h3>Botas</h3>
                            <p>Nivel 1 - <strong>300✨</strong></p>
                        </div>
                        <button class="boton">Comprar</button>
                    </article>

                    <article class="tarjeta">
                        <span>🛡️</span>
                        <div>
                            <h3>Accesorio</h3>
                            <p>Nivel 3 - <strong>750✨</strong></p>
                        </div>
                        <button class="boton">Comprar</button>
                    </article>
                </div>
            </div>

        </main>
    </body>
    <footer>
        <nav class="menu-navegacion">
            <a href="lobby.html">Lobby</a>
            <a href="tienda.html" class="activo">Tienda</a>
            <a href="personaje.html">Personaje</a>
            <a href="configuracion.html">Configuración</a>
        </nav>
    </footer>
</html>
