<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Configuración - Hontanilla Games</title>
        <link rel="stylesheet" href="css/estilos.css">
    </head>
    <body>
        <header class="barra">
            <div class="barra_derecha">
                <img class="logo_barra" src="img/Logo.png">
                Hontanilla Games
            </div>
            <div>
                <p><span>1.000✨</span></p>
                <div>Apodo Jugador</div>
            </div>
        </header>

        <main class="principal">
        
            <h2>Configuración</h2>

            <div class="tarjeta tarjeta-configuracion">
                
                <form action="lobby.html" method="post">
                    <div class="grupo-formulario">
                        <label for="nuevo-apodo">Cambiar Apodo</label>
                        <input type="text" id="nuevo-apodo" name="apodo" value="Jugador" required autocomplete="off">
                    </div>

                    <div class="grupo-formulario checkbox-grupo">
                        <label>
                            <input type="checkbox" name="notificaciones" checked>
                            ¿Sonido?
                        </label>
                    </div>

                    <button type="submit" class="boton boton--primario">Guardar cambios</button>
                </form>

                <div class="opciones-peligro">
                    <a href="index.html" class="boton boton--secundario">Cerrar sesión</a>
                </div>

            </div>

        </main>
    </body>
    <footer>
        <nav class="menu-navegacion">
            <a href="lobby.html">Lobby</a>
            <a href="tienda.html">Tienda</a>
            <a href="personaje.html">Personaje</a>
            <a href="configuracion.html" class="activo">Configuración</a>
        </nav>
    </footer>
</html>
