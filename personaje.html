<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Personaje - Hontanilla Games</title>
        <link rel="stylesheet" href="css/estilos.css">
    </head>
    <body>
        <header class="barra">
            <div class="barra_derecha">
                <img class="logo_barra" src="img/Logo.png">
                Hontanilla Games
            </div>
            <div>
                <p><span data-dato="aura">1.000</span>✨</p>
                <div data-dato="apodo">Apodo Jugador</div>
            </div>
        </header>

        <main class="principal">
            <h2>Tu Personaje</h2>
            <div class="rejilla-personaje-completa">
                
                <section class="tarjeta columna-avatar">
                    <img class="avatar-personaje" src="img/foto_perfil_determinado.png">
                    <h3 data-dato="apodo">Apodo Jugador</h3>
                    <div class="equipamiento-usuario">
                        <div class="equipamiento-actual">
                            <p><strong>Casco:</strong> <span data-dato="casco-actual">Vacio</span></p>
                            <p><strong>Armadura:</strong> <span data-dato="armadura-actual">Vacio</span></p>
                        </div>
                        <div class="equipamiento-actual">
                            <p><strong>Botas:</strong> <span data-dato="botas-actual">Vacio</span></p>
                            <p><strong>Accesorio:</strong> <span data-dato="accesorio-actual">Vacio</span></p>
                        </div>
                    </div>
                </section>

                <div class="columna-inventario">
                    <h3>Artículos en propiedad</h3>

                    <article class="tarjeta">
                        <span>👑</span>
                        <div>
                            <h4>Casco de Cristal</h4>
                            <p>Estado: Comprado</p>
                        </div>
                        <button class="boton">Equipar</button>
                    </article>

                    <article class="tarjeta">
                        <span>🥾</span>
                        <div>
                            <h4>Botas Voladoras</h4>
                            <p>Estado: Comprado</p>
                        </div>
                        <button class="boton">Equipar</button>
                    </article>
                </div>

            </div>
        </main>
    </body>
    <footer>
        <nav class="menu-navegacion">
            <a href="lobby.html">Lobby</a>
            <a href="tienda.html">Tienda</a>
            <a href="personaje.html" class="activo">Personaje</a>
            <a href="configuracion.html">Configuración</a>
        </nav>
    </footer>
</html>
