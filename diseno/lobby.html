<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Lobby - Hontanilla Games</title>
        <link rel="stylesheet" href="css/estilos.css">
    </head>
    <body>
        <header class="barra">
            <div class="barra_derecha">
                <img class="logo_barra" src="img/Logo.png">
                Hontanilla Games
            </div>
            <div>
                <p><span>1.000✨</span></p>
                <div>Apodo Jugador</div>
            </div>
        </header>

        <main class="principal">
        
            <section class="tarjeta tarjeta-personaje">
                <img class="foto_perfil_lobby" src="img/foto_perfil_determinado.png">
                <div class="info-personaje">
                    <h2>Apodo Jugador</h2>
                    <p>Nivel 1 • Guardián del Aura</p>
                </div>
            </section>

            <section class="seccion-bonus">
                <button class="boton boton--bonus">
                    🎁 Reclamar Bonus Diario (+100 aura)
                </button>
            </section>

            <section class="seccion-juegos">
                <h2>Minijuegos</h2>
                <div class="rejilla-juegos">
                    <article class="tarjeta-juego">
                        <div>
                            <h3>Laberinto Píxel</h3>
                            <p>Encuentra la salida antes de que se agote el tiempo.</p>
                        </div>
                        <span class="proximamente">Próximamente</span>
                    </article>
                </div>
            </section>

        </main>

    </body>
    <footer>
        <nav class="menu-navegacion">
            <a href="lobby.html" class="activo">Lobby</a>
            <a href="tienda.html">Tienda</a>
            <a href="personaje.html">Personaje</a>
            <a href="configuracion.html">Configuración</a>
        </nav>
    </footer>
</html>
